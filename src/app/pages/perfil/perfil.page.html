<ion-header>
  <ion-toolbar>
    <ion-title class="title-bold">Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card *ngIf="user as u">
    <ion-card-header>
      <ion-card-title>{{ u.name }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <p class="ion-no-margin" *ngIf="u.email">
        <strong>Email:</strong><br> {{ u.email }}
      </p>
      <p class="ion-no-margin" *ngIf="u.phone">
        <strong>Teléfono:</strong><br> {{ u.phone }}
      </p>
      <p class="ion-no-margin">
        <strong>ID usuario:</strong><br>{{ u.id }}
      </p>
      <p class="ion-no-margin" *ngIf="u.empresaNombre || u.tenantKey">
        <strong>Empresa:</strong><br>{{ u.empresaNombre || u.tenantKey }}
      </p>
    </ion-card-content>
  </ion-card>

  <ion-card *ngIf="!user">
    <ion-card-content>
      <ion-text color="medium">
        <p class="ion-no-margin">No hay sesión activa.</p>
      </ion-text>
    </ion-card-content>
  </ion-card>

</ion-content>

<ion-footer>
  <div style="padding: 12px 16px; background: white; border-top: 1px solid #e0e0e0;">
    <ion-button
      expand="block"
      color="danger"
      (click)="logout()"
    >
      Cerrar sesión
    </ion-button>

    <ion-button
      expand="block"
      fill="outline"
      style="margin-top: 8px;"
      (click)="changeTenant()"
    >
      Cambiar empresa
    </ion-button>
  </div>
</ion-footer>
