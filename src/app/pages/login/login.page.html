<ion-content class="ion-padding" [scrollY]="true">
  <div class="page-center">
    <div class="box-wrapper">
      <div class="login-box">

        <div class="brand-logo-small">
          <img src="assets/logo-facturacion.png" alt="ARTIBusiness Facturación" />
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="login-card">

          <ion-item>
            <ion-input
              formControlName="username"
              [label]="'auth.login.usernameLabel' | transloco"
              label-placement="stacked"
              [placeholder]="'auth.login.usernamePlaceholder' | transloco">
            </ion-input>
          </ion-item>

          <ion-text color="danger" *ngIf="submitted && form.controls.username.invalid">
            <small>{{ 'auth.login.usernameRequired' | transloco }}</small>
          </ion-text>

          <ion-item>
            <ion-input
              formControlName="password"
              [label]="'auth.login.passwordLabel' | transloco"
              label-placement="stacked"
              [type]="verContrasena ? 'text' : 'password'">
            </ion-input>
            <!-- type="button" es imprescindible: dentro de un <form>, un botón sin tipo envía
                 el formulario, así que el ojo habría intentado iniciar sesión. -->
            <ion-button
              slot="end"
              fill="clear"
              type="button"
              class="ojo-contrasena"
              [attr.aria-label]="(verContrasena ? 'auth.login.hidePassword' : 'auth.login.showPassword') | transloco"
              (click)="alternarVerContrasena()">
              <ion-icon slot="icon-only" [name]="verContrasena ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </ion-item>

          <ion-text color="danger" *ngIf="submitted && form.controls.password.invalid">
            <small>{{ 'auth.login.passwordInvalid' | transloco }}</small>
          </ion-text>

          <ion-text color="danger" *ngIf="errorMsg">
            <p style="margin: 12px 0 0 0; font-size: 14px; text-align: center;">{{ errorMsg }}</p>
          </ion-text>

          <ion-button type="submit" expand="block" class="ion-margin-top" [disabled]="entrando">
            <ion-spinner *ngIf="entrando" slot="start" name="dots"></ion-spinner>
            {{ (entrando ? 'auth.login.signingIn' : 'auth.login.submit') | transloco }}
          </ion-button>

          <ion-button
            fill="clear"
            size="small"
            class="forgot"
            routerLink="/forgot-password"
            type="button"
            [disabled]="entrando"
          >
            {{ 'auth.login.forgotPassword' | transloco }}
          </ion-button>

          <div class="ion-text-center ion-margin-top">
            <a (click)="goToSetup()" style="color: #007aff; cursor: pointer; font-size: 13px;">
              {{ 'auth.login.changeAccessKey' | transloco }}
            </a>
          </div>

        </form>
      </div>
    </div>

    <app-language-selector></app-language-selector>
  </div>
</ion-content>
