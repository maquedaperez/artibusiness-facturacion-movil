<ion-content class="ion-padding" [scrollY]="true">
  <div class="page-center">
    <div class="login-box">

      <div class="brand-logo-small">
        <img src="assets/logo-facturacion.png" alt="ARTIBusiness Facturación" />
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="login-card">

        <ion-item>
          <ion-input
            formControlName="username"
            [label]="'auth.login.usernameLabel' | transloco"
            label-placement="stacked"
            [placeholder]="'auth.login.usernamePlaceholder' | transloco">
          </ion-input>
        </ion-item>

        <ion-text color="danger" *ngIf="submitted && form.controls.username.invalid">
          <small>{{ 'auth.login.usernameRequired' | transloco }}</small>
        </ion-text>

        <ion-item>
          <ion-input
            formControlName="password"
            [label]="'auth.login.passwordLabel' | transloco"
            label-placement="stacked"
            type="password">
          </ion-input>
        </ion-item>

        <ion-text color="danger" *ngIf="submitted && form.controls.password.invalid">
          <small>{{ 'auth.login.passwordInvalid' | transloco }}</small>
        </ion-text>

        <ion-text color="danger" *ngIf="errorMsg">
          <p style="margin: 12px 0 0 0; font-size: 14px; text-align: center;">{{ errorMsg }}</p>
        </ion-text>

        <ion-button type="submit" expand="block" class="ion-margin-top">
          {{ 'auth.login.submit' | transloco }}
        </ion-button>

        <ion-button
          fill="clear"
          size="small"
          class="forgot"
          routerLink="/forgot-password"
          type="button"
        >
          {{ 'auth.login.forgotPassword' | transloco }}
        </ion-button>

        <div class="ion-text-center ion-margin-top">
          <a (click)="goToSetup()" style="color: #007aff; cursor: pointer; font-size: 13px;">
            {{ 'auth.login.changeAccessKey' | transloco }}
          </a>
        </div>

      </form>

      <app-language-selector></app-language-selector>
    </div>
  </div>
</ion-content>
