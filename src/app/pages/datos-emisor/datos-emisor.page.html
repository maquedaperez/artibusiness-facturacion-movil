<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="volver()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="title-bold">Datos fiscales de la empresa</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <app-demo-banner></app-demo-banner>

  <ion-text color="medium">
    <p class="ion-no-margin ion-padding-bottom">
      Estos son los datos que aparecen como emisor en tus facturas. Ninguno se
      puede editar desde la app — proceden del alta de tu empresa.
    </p>
  </ion-text>

  <div class="section-title">Identidad fiscal <span class="solo-lectura-tag">No editable</span></div>

  <ion-radio-group [value]="emisor.esEmpresa">
    <ion-item [disabled]="true">
      <ion-radio [value]="false" [disabled]="true" justify="start" labelPlacement="end">Autónomo</ion-radio>
    </ion-item>
    <ion-item [disabled]="true">
      <ion-radio [value]="true" [disabled]="true" justify="start" labelPlacement="end">Empresa</ion-radio>
    </ion-item>
  </ion-radio-group>

  <ion-item [disabled]="true">
    <ion-input
      [label]="emisor.esEmpresa ? 'Razón social' : 'Nombre y apellidos'"
      labelPlacement="stacked"
      [value]="emisor.nombre"
      [readonly]="true"
    ></ion-input>
  </ion-item>

  <ion-item [disabled]="true">
    <ion-input
      [label]="emisor.esEmpresa ? 'CIF' : 'NIF'"
      labelPlacement="stacked"
      [value]="emisor.nif"
      [readonly]="true"
    ></ion-input>
  </ion-item>

  <div class="section-title">Dirección y contacto <span class="solo-lectura-tag">No editable</span></div>

  <ion-item [disabled]="true">
    <ion-input label="Dirección" labelPlacement="stacked" [value]="emisor.direccion" [readonly]="true"></ion-input>
  </ion-item>

  <ion-item [disabled]="true">
    <ion-input label="Población" labelPlacement="stacked" [value]="emisor.poblacion" [readonly]="true"></ion-input>
  </ion-item>

  <ion-item [disabled]="true">
    <ion-input label="Código postal" labelPlacement="stacked" [value]="emisor.cp" [readonly]="true"></ion-input>
  </ion-item>

  <ion-item [disabled]="true">
    <ion-input label="Provincia" labelPlacement="stacked" [value]="emisor.provincia" [readonly]="true"></ion-input>
  </ion-item>

  <ion-item [disabled]="true">
    <ion-input label="Teléfono" labelPlacement="stacked" type="tel" [value]="emisor.telefono" [readonly]="true"></ion-input>
  </ion-item>

  <ng-container *ngIf="emisor.esEmpresa">
    <div class="section-title">Datos adicionales <span class="solo-lectura-tag">No editable</span></div>

    <ion-item [disabled]="true">
      <ion-input label="Registro mercantil (Tomo/Folio/Hoja)" labelPlacement="stacked" [value]="emisor.registroMercantil" [readonly]="true"></ion-input>
    </ion-item>

    <ion-item [disabled]="true">
      <ion-input label="CNAE" labelPlacement="stacked" [value]="emisor.cnae" [readonly]="true"></ion-input>
    </ion-item>

    <ion-item [disabled]="true">
      <ion-input label="IBAN" labelPlacement="stacked" [value]="emisor.iban" [readonly]="true"></ion-input>
    </ion-item>

    <ion-item [disabled]="true">
      <ion-input label="SWIFT" labelPlacement="stacked" [value]="emisor.swift" [readonly]="true"></ion-input>
    </ion-item>
  </ng-container>

</ion-content>
