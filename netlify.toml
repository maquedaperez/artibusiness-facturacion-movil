[build]
  command = "npm run build"
  publish = "www"

[build.environment]
  NODE_VERSION = "20"

# Proxies server-a-servidor para evitar CORS en el build web (Netlify).
# La build nativa (Capacitor/CapacitorHttp) no pasa por aquí y no le afecta.
#
# ⚠️ TEMPORAL: apuntando a Development porque DocumentoController (OCR) todavía no está
# publicado en Producción — ver docs/OCR_BACKEND_INTEGRATION.md. Revertir a
# https://webapiartibusiness-dvh6d7b8a7c9dsfr.westeurope-01.azurewebsites.net en cuanto el
# jefe publique ahí. Mientras tanto, el login en Netlify solo funciona con usuarios que
# existan en la base de datos de Development.
[[redirects]]
  from = "/api/*"
  to = "https://webapiartibusinessdevelopment-e8htgkdhhhfpbeem.westeurope-01.azurewebsites.net/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/config-api/configuration"
  to = "https://configurationapidispatcher-h2g0g4amcgdmaddh.westeurope-01.azurewebsites.net/api/configuration"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
